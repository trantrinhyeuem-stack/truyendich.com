<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không đủ độ tuổi</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    h2 {
      margin-bottom: 12px;
      color: #ff5252;
    }
    p {
      font-size: 15px;
      color: #ccc;
      line-height: 1.5;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #ff5252;
      color: #fff;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>⛔ Truy cập bị từ chối</h2>
  <p>
    Nội dung này không phù hợp với bạn.<br>
    Hãy quay lại vào <b>năm sinh nhật 18 tuổi</b> của bạn nhé 🎂
  </p>
  <button onclick="exitWeb()">Xác nhận & Thoát</button>
</div>

<script>
  function exitWeb() {
    // Thử đóng tab
    window.open('', '_self');
    window.close();
  }
</script>

</body>
</html>
